# nginx: load balancer untuk Booking Service + penyaji dashboard statis.

# Upstream berisi 2 replika Booking Service. Default-nya round-robin,
# jadi request /api/ tersebar merata ke kedua replika (API load balancing).
upstream booking_backend {
    server booking-1:8000;
    server booking-2:8000;
}

server {
    listen 80;

    # Dashboard (GUI) disajikan sebagai file statis.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Semua request /api/* di-proxy & di-load-balance ke Booking Service.
    # Prefix /api/ dibuang sebelum diteruskan (trailing slash pada proxy_pass).
    location /api/ {
        proxy_pass http://booking_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Upstream $upstream_addr;
        add_header X-Served-By $upstream_addr always;
    }
}
